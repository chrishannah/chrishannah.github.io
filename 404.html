<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal lost — chrishannah.dev</title>
  <meta name="theme-color" content="#05070c" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%232dd4ee' stroke-width='6'/%3E%3Cellipse cx='50' cy='50' rx='42' ry='16' fill='none' stroke='%232dd4ee' stroke-width='4'/%3E%3Cline x1='8' y1='50' x2='92' y2='50' stroke='%232dd4ee' stroke-width='4'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .lost {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
    }
    .lost .code {
      font-family: var(--mono);
      font-size: clamp(3rem, 14vw, 6rem);
      font-weight: 600;
      color: var(--accent);
      margin: 0;
      letter-spacing: 0.08em;
    }
    .lost .msg {
      font-family: var(--mono);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--fg-dim);
      font-size: 0.8rem;
      margin: 0.5rem 0 1.75rem;
    }
    .lost a {
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.6rem 1.1rem;
    }
    .lost a:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--panel-2);
    }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <main class="lost">
    <p class="code">404</p>
    <p class="msg">Signal lost · no data at this coordinate</p>
    <a href="/">&larr; Return to dashboard</a>
  </main>
</body>
</html>
