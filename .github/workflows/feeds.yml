name: Update feed cache

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/feeds.yml"
      - ".github/scripts/fetch-feeds.mjs"

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: true

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest posts, focus, and deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: node .github/scripts/fetch-feeds.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/feeds.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/feeds.json
            git commit -m "chore: refresh feed cache"
            git push
          else
            echo "No feed changes."
          fi
